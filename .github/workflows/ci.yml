# LegalLens CI Pipeline — Phase 8
# Comprehensive CI/CD with testing, linting, coverage, and security scanning
# architecture.md §4: GitHub Actions
# code-standards.md §Testing: CI-enforced coverage gates (backend ≥80%)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint + security scan ─────────────────────────────────────────
  api-lint:
    name: API — Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dev dependencies
        working-directory: apps/api
        run: |
          pip install ruff==0.6.9 mypy==1.11.2 bandit[toml]==1.7.9 safety==3.2.7

      - name: Lint with ruff
        working-directory: apps/api
        run: |
          echo "Running ruff linter..."
          ruff check app/ tests/ --output-format=github

      - name: Type-check with mypy
        working-directory: apps/api
        run: |
          echo "Running mypy type checker..."
          mypy app/ --ignore-missing-imports --no-error-summary

      - name: Security scan with bandit
        working-directory: apps/api
        run: |
          echo "Running bandit security scanner..."
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f screen
        continue-on-error: true

      - name: Dependency vulnerability check
        working-directory: apps/api
        run: |
          echo "Checking for vulnerable dependencies..."
          safety check --json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: apps/api/bandit-report.json
          retention-days: 30

  # ── Backend: unit + integration tests with coverage ────────────────────────
  api-test:
    name: API — Tests & Coverage
    runs-on: ubuntu-latest
    needs: api-lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: legallens_test
          POSTGRES_USER: legallens
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://legallens:testpassword@localhost:5432/legallens_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      S3_BUCKET: legallens-test
      S3_ENDPOINT_URL: ""
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      ANTHROPIC_API_KEY: sk-ant-test
      VOYAGE_API_KEY: pa-test
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: apps/api
        run: |
          echo "Running unit tests..."
          pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        working-directory: apps/api
        run: |
          echo "Running integration tests..."
          pytest tests/integration/ -v --tb=short

      - name: Run all tests with coverage
        working-directory: apps/api
        run: |
          echo "Running full test suite with coverage..."
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            -v
          
          echo "Coverage report generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/htmlcov/
          retention-days: 30

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

  # ── Frontend: lint + type-check + tests ────────────────────────────────────
  web-lint-test:
    name: Web — Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type-check with TypeScript
        working-directory: apps/web
        run: |
          echo "Running TypeScript compiler..."
          npm run type-check

      - name: Lint with ESLint
        working-directory: apps/web
        run: |
          echo "Running ESLint..."
          npm run lint

      - name: Run unit tests
        working-directory: apps/web
        run: |
          echo "Running Jest tests..."
          npm test -- --coverage --watchAll=false

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/web/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Build verification ─────────────────────────────────────────────────────
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [api-test, web-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          tags: legallens-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: legallens-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Status check (required for merge) ──────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [api-lint, api-test, web-lint-test, build-check]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.api-lint.result }}" != "success" ]] || \
             [[ "${{ needs.api-test.result }}" != "success" ]] || \
             [[ "${{ needs.web-lint-test.result }}" != "success" ]] || \
             [[ "${{ needs.build-check.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed! ✅"
